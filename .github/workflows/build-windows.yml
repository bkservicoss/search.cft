name: Build Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'searchcrt.py'
      - 'searchcrt.spec'
      - 'assets/identidade/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do app desktop
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd pyinstaller

      - name: Gerar o executável
        run: pyinstaller --noconfirm searchcrt.spec

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Search.CRT-windows
          path: dist/Search.CRT.exe
          retention-days: 30
